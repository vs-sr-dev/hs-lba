<?xml version="1.0"?>
<!--
    lba-keys.cfg — MAME controller profile that puts the LBA1 DOS keyboard back
    under your fingers.

    src/platform_in.c maps the HyperScan pad onto the engine's DOS key globals;
    this file maps the DOS keys back onto the pad, so that playing the port in
    MAME with a keyboard feels exactly like playing the 1994 build. Every line
    below is the inverse of one line there — if that table changes, this one has
    to change with it.

        keyboard        pad             engine
        ────────────────────────────────────────────────────────────────
        arrow keys      analog stick    Joy            (MAME default, untouched)
        Space           Green           F_SPACE   action
        Enter           Yellow          F_RETURN  throw / recentre / validate
        Alt             Blue            F_ALT     use the weapon
        Ctrl            Red             F_CTRL    status / behaviour menu
        Shift           Select          F_SHIFT   inventory
        Escape          Start           K_ESC     quit / save menu
        Q / W           L1 / R1         behaviour, one step left / right
        1 / 2           L2 / R2         K_1 / K_2 magic ball / magic sword

    Q and W have no counterpart in the DOS build: the shoulders are a silent
    one-press behaviour change, where the keyboard had only hold-Ctrl-and-steer.
    Ctrl still does what it always did — that menu is the game's only status
    screen — it just is no longer the only way to change behaviour.

    H, the holomap, is not here: the pad has no button left for it, so on this
    port it is reached from the inventory like every other object, and binding
    a key MAME cannot deliver to the console would be a lie.

    Escape is MAME's own exit key, so it has to be moved out of the way or the
    emulator quits the moment you open the in-game menu. UI Back / UI Cancel go
    to Backspace below — every modifier is spoken for by the game, so the exit
    cannot be a chord, and Backspace is the one plain key that neither the game
    nor MAME's own defaults use.

    Usage:

        hyprscan ... -ctrlrpath d:/Homebrew6/HS-LBA/tools -ctrlr lba-keys

    A controller profile is used rather than cfg/hyprscan.cfg because MAME
    rewrites the latter on every exit; this file it only ever reads.

    Port tags come from src/mame/tvgames/hyperscan_ctrl.cpp (IN.0 and IN.1) and
    the two controller slots ctrl0/ctrl1 in spg29x.cpp. Both pads are listed
    because the driver instantiates both and neither declares PORT_PLAYER, so a
    tagless type-level entry would be ambiguous; LBA only ever reads ctrl0.
-->
<mameconfig version="10">
	<system name="hyprscan">
		<input>

			<!-- MAME's own keys, off Escape -->
			<port type="UI_BACK">
				<newseq type="standard">KEYCODE_BACKSPACE</newseq>
			</port>
			<port type="UI_CANCEL">
				<newseq type="standard">KEYCODE_BACKSPACE</newseq>
			</port>

			<!-- pad 0, IN.0 -->
			<port tag=":ctrl0:IN.0" type="P1_BUTTON3" mask="1" defvalue="0">
				<newseq type="standard">KEYCODE_LALT OR KEYCODE_RALT</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_START" mask="2" defvalue="0">
				<newseq type="standard">KEYCODE_ESC</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_SELECT" mask="4" defvalue="0">
				<newseq type="standard">KEYCODE_LSHIFT OR KEYCODE_RSHIFT</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_BUTTON5" mask="8" defvalue="0">
				<newseq type="standard">KEYCODE_Q</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_BUTTON7" mask="16" defvalue="0">
				<newseq type="standard">KEYCODE_W</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_BUTTON6" mask="32" defvalue="0">
				<newseq type="standard">KEYCODE_1</newseq>
			</port>
			<port tag=":ctrl0:IN.0" type="P1_BUTTON8" mask="64" defvalue="0">
				<newseq type="standard">KEYCODE_2</newseq>
			</port>

			<!-- pad 0, IN.1 -->
			<port tag=":ctrl0:IN.1" type="P1_BUTTON2" mask="32" defvalue="0">
				<newseq type="standard">KEYCODE_ENTER OR KEYCODE_ENTERPAD</newseq>
			</port>
			<port tag=":ctrl0:IN.1" type="P1_BUTTON4" mask="64" defvalue="0">
				<newseq type="standard">KEYCODE_LCONTROL OR KEYCODE_RCONTROL</newseq>
			</port>
			<port tag=":ctrl0:IN.1" type="P1_BUTTON1" mask="128" defvalue="0">
				<newseq type="standard">KEYCODE_SPACE</newseq>
			</port>

			<!-- pad 1: same keys, so a stray read of the second controller
			     cannot report something different from the first -->
			<port tag=":ctrl1:IN.0" type="P1_BUTTON3" mask="1" defvalue="0">
				<newseq type="standard">KEYCODE_LALT OR KEYCODE_RALT</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_START" mask="2" defvalue="0">
				<newseq type="standard">KEYCODE_ESC</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_SELECT" mask="4" defvalue="0">
				<newseq type="standard">KEYCODE_LSHIFT OR KEYCODE_RSHIFT</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_BUTTON5" mask="8" defvalue="0">
				<newseq type="standard">KEYCODE_Q</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_BUTTON7" mask="16" defvalue="0">
				<newseq type="standard">KEYCODE_W</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_BUTTON6" mask="32" defvalue="0">
				<newseq type="standard">KEYCODE_1</newseq>
			</port>
			<port tag=":ctrl1:IN.0" type="P1_BUTTON8" mask="64" defvalue="0">
				<newseq type="standard">KEYCODE_2</newseq>
			</port>
			<port tag=":ctrl1:IN.1" type="P1_BUTTON2" mask="32" defvalue="0">
				<newseq type="standard">KEYCODE_ENTER OR KEYCODE_ENTERPAD</newseq>
			</port>
			<port tag=":ctrl1:IN.1" type="P1_BUTTON4" mask="64" defvalue="0">
				<newseq type="standard">KEYCODE_LCONTROL OR KEYCODE_RCONTROL</newseq>
			</port>
			<port tag=":ctrl1:IN.1" type="P1_BUTTON1" mask="128" defvalue="0">
				<newseq type="standard">KEYCODE_SPACE</newseq>
			</port>

		</input>
	</system>
</mameconfig>
