; L.B.A. Configuration file - HyperScan port
;
; NOTE: CRLF line endings are mandatory. LIB_SYS/DEF_FILE.C's
; ReadThisString() scans a value until it sees CR (13) and never tests
; for LF, so on a Unix-terminated file it swallows the rest of the file
; into the value -- 'NoMidi' stops matching, the engine decides a MIDI
; driver was requested, and InitMidiDLL() fails into exit(1).
;
; The DOS original named the driver DLLs it wanted here. This console has one
; video chip and no MPU-401, so MIDI is declared absent. WaveDriver is not a
; DLL name any more, just something other than 'NoWave': that is all ADELINE.C
; tests before calling WaveInitDLL, and src/platform_snd.c answers for the SPU.
; WaveRate is asked for by name through WaveAskVars, so it must stay present.

Language: English
LanguageCD: English

; Voices stream from the disc, not from a hard disk that does not exist.
FlagKeepVoice: OFF
FlagDisplayText: ON

; VESA means "no vendor DLL": src/platform_gfx.c is the driver.
SvgaDriver: VESA

MidiDriver: NoMidi
MidiExec: NoExec
MidiBase:
MidiIRQ:
MidiDMA:
MidiType: Midi

WaveDriver: SPU
WaveExec: NoExec
WaveBase:
WaveIRQ:
WaveDMA:
WaveRate: 22050

MixerDriver: NoMixer
MixerBase:

WaveVolume: 163
MusicVolume: 236
CDVolume: 83
LineVolume: 195
MasterVolume: 195
